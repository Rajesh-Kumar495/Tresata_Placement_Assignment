[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngr"
version = "0.1.0"
description = "Non-GAAP earnings-release review assistant (prototype): deterministic tie-out + bounded LLM steps"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.0",
  "beautifulsoup4>=4.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
